name: Release

# Un tag `vX.Y.Z` publie l'image multi-architecture sur GHCR, puis crée la GitHub Release
# avec le compose épinglé sur cette image, le `.env.template` et les notes générées.
# Seul `GITHUB_TOKEN` est utilisé : aucun secret personnel.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/letoux/blood-pressure

jobs:
  image:
    name: Image multi-architecture (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags : `vX.Y.Z`, `X.Y` et `latest`. Pour une préversion (`v0.0.1-test`),
      # seul `vX.Y.Z-…` est publié : `X.Y` et `latest` restent sur la dernière version stable.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # GitHub renomme les fichiers joints qui commencent par un point :
      # le `.env.template` est donc joint sous le nom `env.template`.
      - name: Préparer les fichiers de la release
        run: |
          mkdir release
          node src/scripts/release-compose.ts "$GITHUB_REF_NAME" > release/docker-compose.yml
          cp .env.template release/env.template
      - name: Créer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          notes="Image : \`${IMAGE}:${GITHUB_REF_NAME}\` (amd64 et arm64).

          Installation : télécharger \`docker-compose.yml\` et \`env.template\` dans un même dossier,
          \`mv env.template .env\`, renseigner les valeurs, puis \`docker compose up -d\`."
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            --generate-notes \
            "${prerelease[@]}" \
            release/docker-compose.yml \
            release/env.template
